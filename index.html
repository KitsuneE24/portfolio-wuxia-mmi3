  <!-- Applique l'ambiance avant le premier rendu, pour éviter un clignotement. -->
  <script>
    try{
      var t = localStorage.getItem("ambiance");
      if(t !== "printemps" && t !== "automne" && t !== "nuit"){
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "nuit" : "automne";
      }
      document.documentElement.setAttribute("data-theme", t);
      if(!sessionStorage.getItem("entered") && !matchMedia("(prefers-reduced-motion: reduce)").matches){
        document.documentElement.setAttribute("data-intro", "1");
      }
    }catch(e){}
  </script>
